# ===== 应用基础 =====
spring.application.name=jiankang
server.port=8080

# ===== 数据库(默认 H2 内存库,开箱即用;生产切换 MySQL 见下方注释) =====
spring.datasource.url=jdbc:h2:mem:jiankang;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# --- MySQL 切换示例 ---
# spring.datasource.url=jdbc:mysql://localhost:3306/jiankang?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== 文件上传大小限制 =====
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# ===== JWT 配置 =====
app.jwt.secret=jiankang-pet-health-secret-key-please-change-in-production-1234567890
app.jwt.expiration-ms=86400000

# ===== 跨域(前端 Vue 开发服务器) =====
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ===== Sentence-BERT 向量化 API =====
# 兼容 http POST {text:[...]} -> 返回向量数组;可用 sentence-transformers 服务的 /encode 端点
embedding.api.url=http://localhost:8000/encode
embedding.api.timeout-ms=30000
embedding.dimensions=384

# ===== 向量库(Chroma / Milvus) =====
vector.store.type=chroma
vector.store.chroma.url=http://localhost:8001
vector.store.collection=pet_health_kb
# Milvus 备用配置
vector.store.milvus.host=localhost
vector.store.milvus.port=19530

# ===== 知识库切片参数 =====
kb.chunk.max-chars=500
kb.chunk.overlap=80
kb.retrieval.top-k=5

# ===== 大模型问答生成(OpenAI 兼容,可选;留空则返回检索拼接答案) =====
llm.api.url=
llm.api.key=
llm.api.model=gpt-3.5-turbo

# ===== 上传文件存储目录 =====
app.upload-dir=./data/uploads
